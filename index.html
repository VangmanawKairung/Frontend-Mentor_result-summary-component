<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/sunflower.png"
    />

    <title>Frontend Mentor Challenge | Results summary component</title>
    <style>
      footer {
        font-size: 11px;
        text-align: center;
      }

      footer a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <main>
        <section class="summary">
          <p>Your Result</p>
          <h1>76 <span>of 100</span></h1>
          <h2>Great</h2>
          <p>
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </section>
        <section class="results">
          <h2>Summary</h2>
          <div class="score-list">
            <div class="score-bar">
              <p class="score-type">
                <span
                  ><img
                    src="./assets/images/icon-reaction.svg"
                    alt="Reaction score icon" /></span
                >Reaction
              </p>
              <p class="score">80<span class="total-score"> / 100</span></p>
            </div>
            <div class="score-bar">
              <p class="score-type">
                <span
                  ><img
                    src="./assets/images/icon-memory.svg"
                    alt="Memory score icon" /></span
                >Memory
              </p>
              <p class="score">92<span class="total-score"> / 100</span></p>
            </div>
            <div class="score-bar">
              <p class="score-type">
                <span
                  ><img
                    src="./assets/images/icon-verbal.svg"
                    alt="Verbal score icon" /></span
                >Verbal
              </p>
              <p class="score">61<span class="total-score"> / 100</span></p>
            </div>
            <div class="score-bar">
              <p class="score-type">
                <span
                  ><img
                    src="./assets/images/icon-visual.svg"
                    alt="Visual score icon" /></span
                >Visual
              </p>
              <p class="score">72<span class="total-score"> / 100</span></p>
            </div>
          </div>
          <button>Continue</button>
        </section>
      </main>
      <footer class="attribution">
        Challenge by
        <a
          href="https://www.frontendmentor.io/challenges/results-summary-component-CE_K6s0maV"
          target="_blank"
          >Frontend Mentor</a
        >. <br />
        Coded by
        <a
          href="https://github.com/VangmanawKairung/frontend-mentor-profile-card-component"
          >Kairung Vangmanaw</a
        >.
      </footer>
    </div>
  </body>
</html>
